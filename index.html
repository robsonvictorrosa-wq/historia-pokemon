<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e3350d">
  <title>A Jornada de Robson Ketchum</title>
  <style>
:root {
  --vermelho: #e3350d;
  --vermelho-esc: #b3260a;
  --escuro: #1f2430;
  --escuro-2: #2c3342;
  --fundo: #f3f4f7;
  --branco: #ffffff;
  --texto: #1f2430;
  --suave: #6b7280;
  --borda: #e5e7eb;
  --amarelo: #ffcb05;
  --azul: #3b6fd8;
  --verde: #1f9d55;
  --raio: 16px;
  --sombra: 0 2px 10px rgba(31, 36, 48, .08);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--fundo);
  color: var(--texto);
  line-height: 1.5;
}
a { color: var(--vermelho-esc); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }

/* ---------- Topo ---------- */
.topo {
  background: var(--vermelho);
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.topo-inner { max-width: 1100px; margin: 0 auto; padding: 10px 16px 6px; }
.marca { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 800; font-size: 1.1rem; }
.pokebola {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  background: linear-gradient(to bottom, #fff 0 45%, var(--escuro) 45% 55%, #fff 55%);
  border: 3px solid var(--escuro);
  position: relative;
}
.topo .pokebola { background: linear-gradient(to bottom, #fff 0 45%, var(--escuro) 45% 55%, #fff 55%); }
.pokebola::after {
  content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%;
  background: #fff; border: 2px solid var(--escuro); left: 50%; top: 50%; transform: translate(-50%, -50%);
}
.abas {
  max-width: 1100px; margin: 0 auto; display: flex; gap: 4px; padding: 0 10px;
  overflow-x: auto; scrollbar-width: none;
}
.abas::-webkit-scrollbar { display: none; }
.abas a {
  color: #ffe3dc; text-decoration: none; padding: 10px 14px; font-weight: 600; font-size: .95rem;
  border-bottom: 3px solid transparent; white-space: nowrap;
}
.abas a:hover { color: #fff; }
.abas a.ativa { color: #fff; border-bottom-color: var(--amarelo); }

/* ---------- Layout ---------- */
.conteudo { max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; }
.rodape { text-align: center; color: var(--suave); font-size: .85rem; padding: 20px 16px 30px; }
.secao { margin-bottom: 26px; }
.secao-titulo { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
.secao-titulo::before { content: ""; width: 6px; height: 1.1em; background: var(--vermelho); border-radius: 3px; }
.grade { display: grid; gap: 14px; }
.grade-2 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.grade-3 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

.card {
  background: var(--branco); border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 16px; border: 1px solid var(--borda);
}
.card h3 { font-size: 1.05rem; }
.suave { color: var(--suave); }
.pequeno { font-size: .85rem; }

/* ---------- Aviso ---------- */
.aviso {
  display: flex; gap: 12px; align-items: flex-start;
  background: #fff8db; border: 1px solid #f5d76e; color: #6b5200;
  border-radius: var(--raio); padding: 12px 14px; margin-bottom: 18px; font-size: .95rem;
}
.aviso-icone { font-size: 1.3rem; line-height: 1; }

/* ---------- Hero ---------- */
.hero {
  background: linear-gradient(135deg, var(--escuro) 0%, var(--escuro-2) 100%);
  color: #fff; border-radius: 20px; padding: 22px 20px; margin-bottom: 18px; position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -50px; top: -50px; width: 190px; height: 190px; border-radius: 50%;
  border: 22px solid rgba(255,255,255,.07);
  background: linear-gradient(to bottom, rgba(227,53,13,.35) 0 46%, transparent 46% 54%, rgba(255,255,255,.06) 54%);
}
.hero h1 { font-size: 1.6rem; margin-bottom: 4px; }
.hero p { margin: 0; color: #cfd5e2; }
.hero .chips { margin-top: 12px; }

/* ---------- Contadores ---------- */
.contadores { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
.contador { background: var(--branco); border-radius: var(--raio); padding: 14px; box-shadow: var(--sombra); border: 1px solid var(--borda); border-top: 4px solid var(--vermelho); }
.contador .num { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
.contador .rot { color: var(--suave); font-size: .85rem; font-weight: 600; }
.contador.azul { border-top-color: var(--azul); }
.contador.amarelo { border-top-color: var(--amarelo); }
.contador.verde { border-top-color: var(--verde); }
.contador.escuro { border-top-color: var(--escuro); }

/* ---------- Chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px;
  font-size: .8rem; font-weight: 600; background: #eef0f4; color: var(--escuro); text-decoration: none; border: 0;
}
.chip.vermelho { background: #fde4dd; color: var(--vermelho-esc); }
.chip.escuro { background: var(--escuro); color: #fff; }
.chip.amarelo { background: #fff3c4; color: #7a5b00; }
.chip.azul { background: #e2ebfc; color: #1e4fb3; }
.chip.verde { background: #dcf3e5; color: #146c3a; }
.hero .chip { background: rgba(255,255,255,.14); color: #fff; }
button.chip, a.chip { cursor: pointer; }

/* ---------- Pokémon ---------- */
.time { display: flex; flex-wrap: wrap; gap: 10px; }
.poke { display: flex; flex-direction: column; align-items: center; width: 84px; text-align: center; }
.poke-img {
  width: 72px; height: 72px; border-radius: 50%; background: #f1f3f7; border: 2px solid var(--borda);
  display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
}
.poke-img img { width: 72px; height: 72px; image-rendering: pixelated; }
.poke-img .fallback { display: none; }
.poke-img.sem-img .fallback {
  display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%;
  border: 3px solid var(--escuro); font-weight: 800; color: var(--escuro); font-size: .95rem;
  background: linear-gradient(to bottom, #f36b4f 0 46%, var(--escuro) 46% 54%, #fff 54%);
  text-shadow: 0 0 3px #fff, 0 0 3px #fff;
}
.poke-nome { font-size: .8rem; font-weight: 700; margin-top: 4px; }
.poke.nao-usado .poke-img { opacity: .6; border-style: dashed; }
.poke-mini { width: 60px; }
.poke-mini .poke-img { width: 52px; height: 52px; }
.poke-mini .poke-img img { width: 56px; height: 56px; }
.poke-mini .poke-img.sem-img .fallback { width: 34px; height: 34px; font-size: .8rem; }

/* ---------- Episódios ---------- */
.filtros { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
@media (min-width: 720px) { .filtros { grid-template-columns: 2fr 1fr 1fr; } }
.campo { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; font-weight: 700; color: var(--suave); }
.campo input, .campo select {
  font: inherit; font-size: 1rem; font-weight: 400; color: var(--texto);
  padding: 10px 12px; border-radius: 12px; border: 1px solid var(--borda); background: #fff; width: 100%;
}
.campo input:focus, .campo select:focus { outline: 2px solid var(--vermelho); border-color: transparent; }
.ep-card { display: flex; gap: 14px; align-items: flex-start; text-decoration: none; color: inherit; transition: transform .1s, box-shadow .1s; }
.ep-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(31,36,48,.12); }
.ep-num {
  flex: none; width: 54px; height: 54px; border-radius: 14px; background: var(--vermelho); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 1.25rem; line-height: 1;
}
.ep-num small { font-size: .6rem; font-weight: 600; opacity: .85; margin-bottom: 2px; }
.ep-card h3 { margin-bottom: 4px; }
.ep-card p { margin: 6px 0 0; font-size: .9rem; color: #444b5a; }
.vazio { text-align: center; color: var(--suave); padding: 30px 10px; }

.voltar { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; font-weight: 700; text-decoration: none; }
.ep-topo { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.ep-topo .ep-num { width: 64px; height: 64px; font-size: 1.5rem; }
.ep-topo h1 { font-size: 1.35rem; margin-bottom: 6px; }
.eventos { margin: 0; padding-left: 22px; }
.eventos li { margin-bottom: 6px; }
.time-bloco { border-top: 1px solid var(--borda); padding-top: 12px; margin-top: 12px; }
.time-bloco:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.poke-detalhe { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
.poke-detalhe .info { flex: 1; min-width: 0; }
.poke-detalhe .info strong { display: block; }
.poke-detalhe .chips { margin-top: 4px; }
.nav-ep { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
.botao {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 12px; font-weight: 700;
  background: var(--escuro); color: #fff; text-decoration: none; font-size: .9rem;
}
.botao.desativado { opacity: .35; pointer-events: none; }

/* ---------- Personagens ---------- */
.pers-card { display: flex; flex-direction: column; gap: 10px; }
.pers-topo { display: flex; gap: 12px; align-items: center; }
.avatar {
  flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--escuro); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem;
}
.papel-protagonista .avatar { background: var(--vermelho); }
.papel-rival .avatar { background: var(--azul); }
.papel-companheiro .avatar { background: var(--verde); }
.papel-mentor .avatar { background: #8a5cd1; }
.papel-familia .avatar, .papel-outro .avatar { background: #6b7280; }
.pers-card h3 { margin: 0; }
.pers-card p { margin: 0; font-size: .92rem; color: #444b5a; }
.sub { font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); margin: 4px 0 6px; }
.historico { width: 100%; border-collapse: collapse; font-size: .88rem; }
.historico td { padding: 6px 4px; border-top: 1px solid var(--borda); vertical-align: middle; }
.historico td:first-child { width: 1%; white-space: nowrap; font-weight: 700; }
.destaque { border: 2px solid var(--vermelho); }

/* ---------- Tabelas ---------- */
.tabela-wrap { overflow-x: auto; background: #fff; border-radius: var(--raio); box-shadow: var(--sombra); border: 1px solid var(--borda); }
table.tabela { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 520px; }
.tabela th { text-align: left; background: var(--escuro); color: #fff; padding: 10px 12px; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.tabela td { padding: 10px 12px; border-top: 1px solid var(--borda); }
.tabela tr:nth-child(even) td { background: #fafbfc; }
.tabela td.n { text-align: center; font-weight: 700; }
.tabela th.n { text-align: center; }
.zero { color: #b8bdc7; font-weight: 400 !important; }

/* ---------- Arcos ---------- */
.linha-tempo { position: relative; padding-left: 28px; }
.linha-tempo::before { content: ""; position: absolute; left: 10px; top: 4px; bottom: 4px; width: 4px; background: #d7dbe3; border-radius: 2px; }
.arco { position: relative; margin-bottom: 16px; }
.arco::before {
  content: ""; position: absolute; left: -25px; top: 18px; width: 18px; height: 18px; border-radius: 50%;
  background: linear-gradient(to bottom, var(--vermelho) 0 44%, var(--escuro) 44% 56%, #fff 56%); border: 2px solid var(--escuro);
}
.arco.atual { border: 2px solid var(--vermelho); }
.faixa { font-size: 1.4rem; font-weight: 800; color: var(--vermelho-esc); }

@media (max-width: 480px) {
  .hero h1 { font-size: 1.35rem; }
  .contador .num { font-size: 1.6rem; }
  .grade-2, .grade-3 { grid-template-columns: 1fr; }
  .contadores { grid-template-columns: repeat(2, 1fr); }
}

/* Abas cabem na tela do celular */
@media (max-width: 560px) {
  .abas { padding: 0 4px; gap: 0; }
  .abas a { flex: 1 1 auto; text-align: center; padding: 10px 6px; font-size: .82rem; }
  .hero::after { opacity: .5; }
}
.texto-ep summary { cursor: pointer; font-weight: 800; font-size: 1.05rem; }
.texto-ep[open] summary { margin-bottom: 10px; }
.texto-ep p { margin: 0 0 .9em; font-size: 1rem; line-height: 1.7; }
.ep-faltando { opacity: .6; border-style: dashed; background: transparent; box-shadow: none; }
.ep-faltando:hover { transform: none; box-shadow: none; }
.ep-faltando .ep-num { background: #c3c8d2; }
.chip.faltando { background: transparent; border: 1px dashed #b8bdc7; color: #9aa1ad; }
.papel-vilao .avatar { background: #4b2a6b; }
.membros { list-style: none; margin: 0; padding: 0; }
.membros li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--borda); }
.membros li:first-child { border-top: 0; padding-top: 0; }
.membros .avatar { width: 38px; height: 38px; font-size: .9rem; }
.poke-micro { width: auto; }
.poke-micro .poke-img { width: 36px; height: 36px; border-width: 1px; }
.poke-micro .poke-img img { width: 40px; height: 40px; }
.poke-micro .poke-img.sem-img .fallback { width: 24px; height: 24px; font-size: .65rem; border-width: 2px; }
.poke-micro .poke-nome { display: none; }
.membros .time { gap: 4px; }
.objetivos { list-style: none; margin: 0; padding: 0; }
.objetivos li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--borda); }
.objetivos li:first-child { border-top: 0; }
.marca-obj { color: var(--vermelho); font-weight: 800; }
.objetivos li.feito { color: var(--suave); text-decoration: line-through; }
.objetivos li.feito .marca-obj { color: var(--verde); }
.evolucao { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.evolucao .seta { font-size: 1.4rem; color: var(--verde); font-weight: 800; }

</style>
</head>
<body>
  <header class="topo">
    <div class="topo-inner">
      <a class="marca" href="#inicio">
        <span class="pokebola" aria-hidden="true"></span>
        <span class="marca-txt" id="titulo-site">A Jornada de Robson Ketchum</span>
      </a>
    </div>
    <nav class="abas" id="abas">
      <a href="#inicio" data-aba="inicio">Início</a>
      <a href="#episodios" data-aba="episodios">Episódios</a>
      <a href="#personagens" data-aba="personagens">Personagens</a>
      <a href="#conquistas" data-aba="conquistas">Conquistas</a>
      <a href="#arcos" data-aba="arcos">Arcos</a>
    </nav>
  </header>

  <main id="app" class="conteudo"></main>

  <footer class="rodape" id="rodape"></footer>

  <script>
/*
 * data.js — TODOS os dados da história ficam aqui.
 * Depois de editar, rode:  python3 build.py   (gera o site-historia-pokemon.html atualizado)
 *
 * ESQUEMA
 * meta:        { titulo, subtitulo, protagonista (nome exato do personagem), atualizadoEm, nota }
 * arcos:       [{ nome, regiao, episodios: { inicio, fim }, provisorio?: true, descricao }]
 *                - inicio/fim podem ser null (desconhecido/em andamento). Ex.: { inicio: 4, fim: null } aparece como "4 – 11+".
 * grupos:      [{ nome, descricao?, membros: [{ nome, funcao, desde?, ate? }] }]
 *                - grupos de viagem. desde = nº do episódio em que entrou; ate = até quando (texto ou nº); obs? = observação.
 * personagens: [{ nome, papel, rivalDe?, idade?, apelidos?, descricao, pokemon, primeiraAparicao, observacoes?, contagemDeclarada? }]
 *                - apelidos: outros nomes usados no texto (ex.: "Gary Carvalho"); também valem em times/aparecem.
 *                - contagemDeclarada: [{ tipo: "insignia"|"fita"|..., quantidade, episodio, fonte }]
 *                  para números ditos em diálogo sem os nomes das conquistas (ex.: "tenho 4 insígnias").
 *                - papel: "protagonista" | "rival" | "companheiro" | "mentor" | "vilao" | "familia" | "outro"
 *                - rivalDe: de quem a pessoa é rival (ex.: "Robson Ketchum" ou "Ash Ketchum").
 *                - pokemon: time atual fixo. Deixe [] para o site calcular: junta todos os Pokémon
 *                  já vistos com o personagem (menos os marcados com saiu: true).
 *                - primeiraAparicao: número do episódio (ou null se ainda não se sabe).
 * conquistasAnteriores: [{ personagem, tipo, nome, local, observacao?, mencionadaNoEpisodio? }]
 *                - conquistas de antes da história começar (aparecem como "Antes da história").
 * objetivos:   [{ descricao, personagem?, origem (nº do episódio), status: "pendente" | "concluido", concluidoEm? }]
 * episodes:    [{ numero, titulo, arco (nome do arco), local, resumo (2 a 4 frases),
 *                 eventos: ["...", ...],
 *                 aparecem: ["nome", ...]            (personagens presentes, mesmo sem time conhecido)
 *                 times: { "Nome do personagem": [ "Pikachu"  OU  { nome, golpes?: [], nota?, personalidade?, usado?: false, saiu?: true } ] },
 *                 lendarios?: [ "Suicune"  OU  { nome, nota } ]     (Pokémon lendários avistados)
 *                 novosGolpes?: [{ pokemon, personagem, golpe, nota? }]  (golpes aprendidos/revelados no episódio)
 *                 itens?: [{ nome, descricao, personagem? }]      (itens importantes para a trama, ex.: GS Ball)
 *                 evolucoes?: [{ personagem, de, para }]          (o time passa a mostrar a forma evoluída)
 *                 conquistas: [{ personagem, tipo, nome, local }]
 *                    - tipo: "insignia" | "fita" | "ilha" | "desafio" | "outro"
 *                 resultados?: [{ personagem, evento, resultado }]   (opcional: vitórias, derrotas, colocações)
 *                 proximoObjetivo?: "...",
 *                 texto?: "..." }]   (opcional: texto completo do episódio; parágrafos separados por linha em branco)
 * Os nomes dos personagens em "times", "aparecem", "conquistas", "resultados" e "grupos"
 * devem ser iguais ao campo "nome" em personagens. Episódios que faltam aparecem sozinhos como "ainda não enviado".
 */
window.STORY_DATA = {
  meta: {
    titulo: "A Jornada de Robson Ketchum",
    subtitulo: "O acompanhamento da história, episódio por episódio",
    protagonista: "Robson Ketchum",
    atualizadoEm: "24/09/2026",
    nota: "Os dados estão sendo preenchidos aos poucos, conforme os episódios chegam. Arcos e números ainda são provisórios."
  },

  arcos: [
    {
      nome: "Prólogo: Sinnoh e Pallet",
      regiao: "Sinnoh e Kanto",
      episodios: { inicio: 1, fim: 3 },
      provisorio: true,
      descricao: "A formatura de Robson na Academia Pokémon de Sinnoh, o nascimento de Riolu, a volta para casa em Pallet, o reencontro com Ash e a derrota para o rival Josias, que leva os irmãos a partirem para Johto."
    },
    {
      nome: "Johto",
      regiao: "Johto",
      episodios: { inicio: 4, fim: null },
      provisorio: true,
      descricao: "Robson recebe Cyndaquil em New Bark, ganha Dratini, conhece Wallace, decide se tornar Coordenador, forma o seu grupo com Renato e Eyshila e disputa o seu primeiro Contest em Johto, em Cidade Violeta."
    }
  ],

  grupos: [
    {
      nome: "Grupo de Robson",
      membros: [
        { nome: "Robson Ketchum", funcao: "Protagonista" },
        { nome: "Renato", funcao: "Companheiro de viagem", desde: 7 },
        { nome: "Eyshila", funcao: "Companheira de viagem", desde: 8 },
        { nome: "Wallace", funcao: "Mentor", desde: 11, ate: 14, obs: "Deixou o grupo no Ep. 14, antes de Azaleia." }
      ]
    },
    {
      nome: "Grupo de Ash",
      membros: [
        { nome: "Ash Ketchum", funcao: "Treinador" },
        { nome: "Misty", funcao: "Companheira de viagem" },
        { nome: "Brock", funcao: "Companheiro de viagem" }
      ]
    }
  ],

  personagens: [
    {
      nome: "Robson Ketchum",
      papel: "protagonista",
      idade: 10,
      descricao: "Irmão mais novo de Ash Ketchum. Estudioso, estratégico e quieto, bem diferente do irmão. Aos 7 anos, ganhou uma bolsa na Academia Pokémon de Sinnoh, onde se formou. Declarou que vai se tornar Mestre Pokémon antes de Ash e, inspirado por Wallace, decidiu também se tornar Top Coordenador. Consegue sentir Riolu por meio da Aura.",
      pokemon: [],
      primeiraAparicao: 1
    },
    {
      nome: "Josias Carvalho",

    h += "</section>";

    // Conquistas e resultados
    h += '<div class="grade grade-2" style="margin-top:14px">';
    h += '<section class="card"><h3>🏅 Conquistas</h3>' + ((ep.conquistas || []).length ?
      '<ul class="eventos">' + ep.conquistas.map(function (c) {
        var ti = tipoInfo(c.tipo);
        return '<li><span class="chip ' + ti.cor + '">' + esc(ti.sing) + "</span> <strong>" + esc(c.nome) + "</strong> — " +
          esc(c.personagem) + (c.local ? " (" + esc(c.local) + ")" : "") + "</li>";
      }).join("") + "</ul>" : '<p class="suave">Nenhuma conquista neste episódio.</p>') + "</section>";
    if ((ep.resultados || []).length) {
      h += '<section class="card"><h3>📋 Resultados</h3><ul class="eventos">' + ep.resultados.map(function (r) {
        return "<li><strong>" + esc(r.personagem) + "</strong> — " + esc(r.evento ? r.evento + ": " : "") + esc(r.resultado) + "</li>";
      }).join("") + "</ul></section>";
    }
    h += "</div>";

    h += '<div class="nav-ep"><a class="botao' + (ant ? "" : " desativado") + '" href="#episodios/' + (ant ? ant.numero : "") + '">← ' +
      (ant ? "Ep. " + ant.numero : "Anterior") + '</a><a class="botao' + (prox ? "" : " desativado") + '" href="#episodios/' +
      (prox ? prox.numero : "") + '">' + (prox ? "Ep. " + prox.numero : "Próximo") + " →</a></div>";
    return h;
  }

  function cardPersonagem(p) {
    var atual = timeAtual(p), hist = historicoTime(p), c = contagem(p);
    var h = '<article class="card pers-card papel-' + esc(p.papel) + (p === PROTAGONISTA ? " destaque" : "") + '">' +
      '<div class="pers-topo"><div class="avatar">' + esc(iniciais(p.nome)) + "</div><div><h3>" + esc(p.nome) + "</h3>" +
      '<div class="chips"><span class="chip">' + esc(rotuloPapel(p)) + "</span>" +
      (p.idade ? '<span class="chip azul">' + esc(p.idade) + " anos</span>" : "") +
      (c.total ? '<span class="chip amarelo">🏅 ' + c.total + (c.total === 1 ? " conquista" : " conquistas") + "</span>" : "") +
      "</div></div></div>" +
      (p.apelidos && p.apelidos.length ? '<p class="pequeno suave">Também chamado de: ' + esc(p.apelidos.join(", ")) + "</p>" : "") +
      "<p>" + esc(p.descricao) + "</p>" +
      ((p.contagemDeclarada || []).length ? '<div class="chips">' + p.contagemDeclarada.map(function (d) {
        return '<span class="chip amarelo">🏅 ' + esc(textoDeclarado(d)) + "</span>";
      }).join("") + "</div>" : "") +
      (p.observacoes ? '<p class="pequeno suave">' + esc(p.observacoes) + "</p>" : "") +
      '<p class="pequeno suave">Primeira aparição: ' + esc(textoPrimeiraAparicao(p)) + "</p>" +
      '<div><div class="sub">Time atual</div>' + listaTime(atual, true) + "</div>";
    var ess = atual.filter(function (x) { return x.personalidade; });
    if (ess.length) {
      h += '<div><div class="sub">Essência de cada Pokémon</div><table class="historico">' + ess.map(function (x) {
        return "<tr><td>" + esc(x.nome) + '</td><td class="pequeno">' + esc(x.personalidade) + "</td></tr>";
      }).join("") + "</table></div>";
    }
    if (hist.length) {
      h += '<div><div class="sub">Histórico do time</div><table class="historico">' + hist.map(function (x) {
        return "<tr><td>" + esc(x.nome) + '</td><td><div class="chips">' + x.eps.map(function (n) {
          return '<a class="chip vermelho" href="#episodios/' + n + '">Ep. ' + n + "</a>";
        }).join("") + (x.origem ? '<span class="chip verde">⬆ ' + esc(x.origem) + "</span>" : "") +
          (x.evo ? '<span class="chip verde">⬆ ' + esc(x.evo) + "</span>" : "") + "</div></td></tr>";
      }).join("") + "</table></div>";
    }
    return h + "</article>";
  }
  function paginaGrupos() {
    var grupos = D.grupos || [];
    if (!grupos.length) return "";
    return '<section class="secao"><h3 class="secao-titulo">Grupos de viagem</h3><div class="grade grade-2">' +
      grupos.map(function (g) {
        return '<article class="card grupo"><h3>🎒 ' + esc(g.nome) + "</h3>" + (g.descricao ? '<p class="pequeno suave">' + esc(g.descricao) + "</p>" : "") +
          '<ul class="membros">' + (g.membros || []).map(function (m) {
            var pers = acharPersonagem(m.nome) || { nome: m.nome, papel: "outro" };
            var periodo = [];
            if (m.desde != null) periodo.push("desde o Ep. " + m.desde);
            if (m.ate != null) periodo.push("até " + (typeof m.ate === "number" ? "o Ep. " + m.ate : m.ate));
            return '<li class="papel-' + esc(pers.papel) + '"><div class="avatar">' + esc(iniciais(pers.nome)) + "</div><div><strong>" + esc(pers.nome) + "</strong>" +
              '<div class="pequeno suave">' + esc(m.funcao || rotuloPapel(pers)) + (periodo.length ? " · " + esc(periodo.join(", ")) : "") + "</div>" +
              (m.obs ? '<div class="pequeno suave"><em>' + esc(m.obs) + "</em></div>" : "") +
              '<div class="time" style="margin-top:4px">' + timeAtual(pers).map(function (p) { return sprite(p.nome, true, "poke-micro", p.nota); }).join("") + "</div>" +
              "</div></li>";
          }).join("") + "</ul></article>";
      }).join("") + "</div></section>";
  }
  function paginaPersonagens() {
    var h = '<h2 class="secao-titulo">Personagens</h2>' + aviso() + paginaGrupos();
    var grupos = [
      { titulo: "Protagonista", papeis: ["protagonista"] },
      { titulo: "Rivais", papeis: ["rival"] },
      { titulo: "Companheiros de viagem", papeis: ["companheiro"] },
      { titulo: "Mentores", papeis: ["mentor"] },
      { titulo: "Vilões", papeis: ["vilao"] },
      { titulo: "Família e outros", papeis: ["familia", "outro"] }
    ];
    var conhecidos = ["protagonista", "rival", "companheiro", "mentor", "vilao", "familia", "outro"];
    grupos.forEach(function (g) {
      var lista = PERSONAGENS.filter(function (p) {
        return g.papeis.indexOf(p.papel) >= 0 || (g.papeis.indexOf("outro") >= 0 && conhecidos.indexOf(p.papel) < 0);
      });
      if (!lista.length) return;
      lista = lista.slice().sort(function (a, b) {
        var ra = a.rivalDe && !mesmo(a.rivalDe, PROTAGONISTA) ? 1 : 0, rb = b.rivalDe && !mesmo(b.rivalDe, PROTAGONISTA) ? 1 : 0;
        return ra - rb;
      });
      h += '<section class="secao"><h3 class="secao-titulo">' + esc(g.titulo) + '</h3><div class="grade grade-3">' +
        lista.map(cardPersonagem).join("") + "</div></section>";
    });
    return h;
  }

  function paginaConquistas() {
    var h = '<h2 class="secao-titulo">Conquistas</h2>' + aviso();
    var p = PROTAGONISTA, c = contagem(p), lista = conquistasDe(p);
    h += '<section class="card destaque secao"><div class="pers-topo papel-protagonista" style="margin-bottom:12px"><div class="avatar">' +
      esc(iniciais(p.nome)) + "</div><div><h3 style=\"margin:0\">" + esc(p.nome) + '</h3><span class="suave pequeno">Protagonista</span></div></div>' +
      '<div class="contadores">' + TIPOS.map(function (t) {
        var cor = { insignia: "amarelo", fita: "", ilha: "azul", desafio: "verde", outro: "escuro" }[t.chave];
        return '<div class="contador ' + cor + '"><div class="num">' + numero(c[t.chave]) + '</div><div class="rot">' + t.nome + "</div></div>";
      }).join("") + "</div>" +
      (lista.length ? tabelaConquistas(lista, false) : '<p class="suave">Nenhuma conquista registrada ainda. A primeira meta é conseguir uma fita no Contest de Azaleia!</p>') +
      "</section>";

    var outros = PERSONAGENS.filter(function (x) { return x !== p; });
    var ordem = ["rival", "companheiro", "mentor", "familia", "outro", "vilao"];
    outros.sort(function (a, b) {
      var ia = ordem.indexOf(a.papel), ib = ordem.indexOf(b.papel);
      return (ia < 0 ? 9 : ia) - (ib < 0 ? 9 : ib);
    });
    h += '<section class="secao"><h3 class="secao-titulo">Rivais, companheiros e outros</h3><div class="tabela-wrap"><table class="tabela"><thead><tr>' +
      '<th>Personagem</th><th>Papel</th>' + TIPOS.map(function (t) { return '<th class="n">' + t.nome + "</th>"; }).join("") + '<th class="n">Total</th></tr></thead><tbody>' +
      outros.map(function (x) {
        var cx = contagem(x);
        return "<tr><td><strong>" + esc(x.nome) + "</strong></td><td>" + esc(rotuloPapel(x)) + "</td>" +
          TIPOS.map(function (t) {
            var d = declaradoMaisRecente(x, t.chave);
            if (d && d.quantidade > cx[t.chave]) {
              return '<td class="n" title="' + esc(textoDeclarado(d)) + '">' + d.quantidade + '<sup>*</sup></td>';
            }
            return '<td class="n">' + numero(cx[t.chave]) + "</td>";
          }).join("") +
          '<td class="n">' + numero(cx.total) + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      '<p class="suave pequeno">Um 0 significa "nenhuma conquista registrada até agora", não necessariamente que o personagem não tenha nenhuma.' +
      ' * = número dito em diálogo, sem os nomes das conquistas.</p>' + listaDeclarados() + "</section>";

    var todas = todasConquistas();
    h += '<section class="secao"><h3 class="secao-titulo">Todas as conquistas registradas</h3>' +
      (todas.length ? tabelaConquistas(todas, true) : '<div class="card vazio">Nenhuma conquista registrada ainda.</div>') + "</section>";

    var res = [];
    EPISODIOS.forEach(function (ep) { (ep.resultados || []).forEach(function (r) { res.push({ r: r, ep: ep }); }); });
    if (res.length) {
      h += '<section class="secao"><h3 class="secao-titulo">Resultados em competições</h3><div class="tabela-wrap"><table class="tabela"><thead><tr>' +
        "<th>Ep.</th><th>Personagem</th><th>Competição</th><th>Resultado</th></tr></thead><tbody>" +
        res.map(function (x) {
          return '<tr><td><a href="#episodios/' + x.ep.numero + '">' + x.ep.numero + "</a></td><td><strong>" + esc(x.r.personagem) + "</strong></td><td>" +
            esc(x.r.evento || "") + "</td><td>" + esc(x.r.resultado) + "</td></tr>";
        }).join("") + "</tbody></table></div></section>";
    }
    return h;
  }
  function listaDeclarados() {
    var itens = [];
    PERSONAGENS.forEach(function (p) {
      (p.contagemDeclarada || []).forEach(function (d) { itens.push({ p: p, d: d }); });
    });
    if (!itens.length) return "";
    return '<div class="card" style="margin-top:12px"><h3>🗣️ Contagens ditas em diálogo</h3><ul class="eventos">' +
      itens.map(function (x) {
        return "<li><strong>" + esc(x.p.nome) + "</strong>: " + esc(textoDeclarado(x.d)) +
          ' <a class="chip" href="#episodios/' + x.d.episodio + '">Ep. ' + x.d.episodio + "</a></li>";
      }).join("") + "</ul></div>";
  }
  function tabelaConquistas(lista, comPersonagem) {
    return '<div class="tabela-wrap"><table class="tabela"><thead><tr>' + (comPersonagem ? "<th>Personagem</th>" : "") +
      "<th>Tipo</th><th>Conquista</th><th>Local</th><th>Episódio</th></tr></thead><tbody>" +
      lista.map(function (x) {
        var ti = tipoInfo(x.c.tipo);
        return "<tr>" + (comPersonagem ? "<td><strong>" + esc(x.c.personagem) + "</strong></td>" : "") +
          '<td><span class="chip ' + ti.cor + '">' + esc(ti.sing) + "</span></td><td>" + esc(x.c.nome) +
          (x.c.observacao ? '<br><span class="suave pequeno">' + esc(x.c.observacao) + "</span>" : "") +
          "</td><td>" + esc(x.c.local || "—") + "</td><td>" + linkEp(x.ep) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function chipsArco(a, eps) {
    var nums = eps.map(function (e) { return e.numero; });
    var ini = a.episodios && a.episodios.inicio != null ? a.episodios.inicio : Math.min.apply(null, nums);
    var fim = a.episodios && a.episodios.fim != null ? a.episodios.fim : Math.max.apply(null, nums);
    var h = "";
    for (var n = ini; n <= fim; n++) {
      var e = eps.filter(function (x) { return x.numero === n; })[0];
      h += e ? '<a class="chip vermelho" href="#episodios/' + n + '" title="' + esc(e.titulo) + '">Ep. ' + n + "</a>" :
        '<span class="chip faltando" title="Episódio ainda não enviado">Ep. ' + n + "</span>";
    }
    return h;
  }
  function paginaArcos() {
    var atual = arcoAtual();
    var h = '<h2 class="secao-titulo">Arcos da história</h2>' + aviso();
    if (!ARCOS.length) return h + '<div class="card vazio">Nenhum arco registrado ainda.</div>';
    h += '<div class="linha-tempo">' + ARCOS.map(function (a) {
      var eps = episodiosDoArco(a);
      return '<article class="card arco' + (atual && atual.nome === a.nome ? " atual" : "") + '">' +
        '<div class="chips" style="margin-bottom:6px">' + (atual && atual.nome === a.nome ? '<span class="chip vermelho">Arco atual</span>' : "") +
        (a.regiao ? '<span class="chip azul">Região: ' + esc(a.regiao) + "</span>" : "") +
        (a.provisorio ? '<span class="chip amarelo">Provisório</span>' : "") + "</div>" +
        "<h3>" + esc(a.nome) + '</h3><div class="faixa">Episódios ' + esc(faixaArco(a)) + "</div>" +
        '<p class="pequeno">' + esc(a.descricao || "") + "</p>" +
        '<div class="sub">Episódios registrados (' + eps.length + ")</div>" +
        (eps.length ? '<div class="chips">' + chipsArco(a, eps) + "</div>" : '<p class="suave pequeno">Nenhum ainda.</p>') + "</article>";
    }).join("") + "</div>";
    return h;
  }

  /* ---------------- roteamento ---------------- */
  function rota() {
    var hash = decodeURIComponent((location.hash || "#inicio").slice(1));
    var partes = hash.split("/");
    var aba = partes[0] || "inicio";
    var html;
    switch (aba) {
      case "episodios": html = partes[1] ? paginaEpisodio(partes[1]) : paginaEpisodios(); break;
      case "personagens": html = paginaPersonagens(); break;
      case "conquistas": html = paginaConquistas(); break;
      case "arcos": html = paginaArcos(); break;
      default: aba = "inicio"; html = paginaInicio();
    }
    app.innerHTML = html;
    if (aba === "episodios" && !partes[1]) ligarFiltros();
    var links = document.querySelectorAll("#abas a");
    for (var i = 0; i < links.length; i++) links[i].classList.toggle("ativa", links[i].getAttribute("data-aba") === aba);
    window.scrollTo(0, 0);
  }

  document.title = META.titulo || document.title;
  var tituloEl = document.getElementById("titulo-site");
  if (tituloEl) tituloEl.textContent = META.titulo || tituloEl.textContent;
  var rod = document.getElementById("rodape");
  if (rod) rod.innerHTML = esc(EPISODIOS.length + (EPISODIOS.length === 1 ? " episódio registrado" : " episódios registrados") + " de ~160") +
    (META.atualizadoEm ? " · Atualizado em " + esc(META.atualizadoEm) : "") + "<br>Fã-ficção original de Robson. Pokémon é marca da Nintendo, Game Freak e The Pokémon Company.";
  window.addEventListener("hashchange", rota);
  rota();
})();

</script>
</body>
</html>
