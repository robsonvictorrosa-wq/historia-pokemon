<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e3350d">
  <title>Pokémon Omniverse - A Jornada de Robson Ketchum</title>
  <meta name="application-name" content="Pokémon Omniverse - A Jornada de Robson Ketchum">
  <meta name="apple-mobile-web-app-title" content="Pokémon Omniverse">
  <meta name="description" content="Pokémon Omniverse - A Jornada de Robson Ketchum: episódios, personagens, times, conquistas e arcos da história.">
  <style>
:root {
  --vermelho: #e3350d;
  --vermelho-esc: #b3260a;
  --escuro: #1f2430;
  --escuro-2: #2c3342;
  --fundo: #f3f4f7;
  --branco: #ffffff;
  --texto: #1f2430;
  --suave: #6b7280;
  --borda: #e5e7eb;
  --amarelo: #ffcb05;
  --azul: #3b6fd8;
  --verde: #1f9d55;
  --raio: 16px;
  --sombra: 0 2px 10px rgba(31, 36, 48, .08);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--fundo);
  color: var(--texto);
  line-height: 1.5;
}
a { color: var(--vermelho-esc); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }

/* ---------- Topo ---------- */
.topo {
  background: var(--vermelho);
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.topo-inner { max-width: 1100px; margin: 0 auto; padding: 10px 16px 6px; }
.marca { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 800; font-size: 1.1rem; }
.pokebola {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  background: linear-gradient(to bottom, #fff 0 45%, var(--escuro) 45% 55%, #fff 55%);
  border: 3px solid var(--escuro);
  position: relative;
}
.topo .pokebola { background: linear-gradient(to bottom, #fff 0 45%, var(--escuro) 45% 55%, #fff 55%); }
.pokebola::after {
  content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%;
  background: #fff; border: 2px solid var(--escuro); left: 50%; top: 50%; transform: translate(-50%, -50%);
}
.abas {
  max-width: 1100px; margin: 0 auto; display: flex; gap: 4px; padding: 0 10px;
  overflow-x: auto; scrollbar-width: none;
}
.abas::-webkit-scrollbar { display: none; }
.abas a {
  color: #ffe3dc; text-decoration: none; padding: 10px 14px; font-weight: 600; font-size: .95rem;
  border-bottom: 3px solid transparent; white-space: nowrap;
}
.abas a:hover { color: #fff; }
.abas a.ativa { color: #fff; border-bottom-color: var(--amarelo); }

/* ---------- Layout ---------- */
.conteudo { max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; }
.rodape { text-align: center; color: var(--suave); font-size: .85rem; padding: 20px 16px 30px; }
.secao { margin-bottom: 26px; }
.secao-titulo { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
.secao-titulo::before { content: ""; width: 6px; height: 1.1em; background: var(--vermelho); border-radius: 3px; }
.grade { display: grid; gap: 14px; }
.grade-2 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.grade-3 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

.card {
  background: var(--branco); border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 16px; border: 1px solid var(--borda);
}
.card h3 { font-size: 1.05rem; }
.suave { color: var(--suave); }
.pequeno { font-size: .85rem; }

/* ---------- Aviso ---------- */
.aviso {
  display: flex; gap: 12px; align-items: flex-start;
  background: #fff8db; border: 1px solid #f5d76e; color: #6b5200;
  border-radius: var(--raio); padding: 12px 14px; margin-bottom: 18px; font-size: .95rem;
}
.aviso-icone { font-size: 1.3rem; line-height: 1; }

/* ---------- Hero ---------- */
.hero {
  background: linear-gradient(135deg, var(--escuro) 0%, var(--escuro-2) 100%);
  color: #fff; border-radius: 20px; padding: 22px 20px; margin-bottom: 18px; position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -50px; top: -50px; width: 190px; height: 190px; border-radius: 50%;
  border: 22px solid rgba(255,255,255,.07);
  background: linear-gradient(to bottom, rgba(227,53,13,.35) 0 46%, transparent 46% 54%, rgba(255,255,255,.06) 54%);
}
.hero h1 { font-size: 1.6rem; margin-bottom: 4px; }
.hero p { margin: 0; color: #cfd5e2; }
.hero .chips { margin-top: 12px; }

/* ---------- Contadores ---------- */
.contadores { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
.contador { background: var(--branco); border-radius: var(--raio); padding: 14px; box-shadow: var(--sombra); border: 1px solid var(--borda); border-top: 4px solid var(--vermelho); }
.contador .num { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
.contador .rot { color: var(--suave); font-size: .85rem; font-weight: 600; }
.contador.azul { border-top-color: var(--azul); }
.contador.amarelo { border-top-color: var(--amarelo); }
.contador.verde { border-top-color: var(--verde); }
.contador.escuro { border-top-color: var(--escuro); }

/* ---------- Chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px;
  font-size: .8rem; font-weight: 600; background: #eef0f4; color: var(--escuro); text-decoration: none; border: 0;
}
.chip.vermelho { background: #fde4dd; color: var(--vermelho-esc); }
.chip.escuro { background: var(--escuro); color: #fff; }
.chip.amarelo { background: #fff3c4; color: #7a5b00; }
.chip.azul { background: #e2ebfc; color: #1e4fb3; }
.chip.verde { background: #dcf3e5; color: #146c3a; }
.hero .chip { background: rgba(255,255,255,.14); color: #fff; }
button.chip, a.chip { cursor: pointer; }

/* ---------- Pokémon ---------- */
.time { display: flex; flex-wrap: wrap; gap: 10px; }
.poke { display: flex; flex-direction: column; align-items: center; width: 84px; text-align: center; }
.poke-img {
  width: 72px; height: 72px; border-radius: 50%; background: #f1f3f7; border: 2px solid var(--borda);
  display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
}
.poke-img img { width: 72px; height: 72px; image-rendering: pixelated; }
.poke-img .fallback { display: none; }
.poke-img.sem-img .fallback {
  display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%;
  border: 3px solid var(--escuro); font-weight: 800; color: var(--escuro); font-size: .95rem;
  background: linear-gradient(to bottom, #f36b4f 0 46%, var(--escuro) 46% 54%, #fff 54%);
  text-shadow: 0 0 3px #fff, 0 0 3px #fff;
}
.poke-nome { font-size: .8rem; font-weight: 700; margin-top: 4px; }
.poke.nao-usado .poke-img { opacity: .6; border-style: dashed; }
.poke-mini { width: 60px; }
.poke-mini .poke-img { width: 52px; height: 52px; }
.poke-mini .poke-img img { width: 56px; height: 56px; }
.poke-mini .poke-img.sem-img .fallback { width: 34px; height: 34px; font-size: .8rem; }

/* ---------- Episódios ---------- */
.filtros { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
@media (min-width: 720px) { .filtros { grid-template-columns: 2fr 1fr 1fr; } }
.campo { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; font-weight: 700; color: var(--suave); }
.campo input, .campo select {
  font: inherit; font-size: 1rem; font-weight: 400; color: var(--texto);
  padding: 10px 12px; border-radius: 12px; border: 1px solid var(--borda); background: #fff; width: 100%;
}
.campo input:focus, .campo select:focus { outline: 2px solid var(--vermelho); border-color: transparent; }
.ep-card { display: flex; gap: 14px; align-items: flex-start; text-decoration: none; color: inherit; transition: transform .1s, box-shadow .1s; }
.ep-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(31,36,48,.12); }
.ep-num {
  flex: none; width: 54px; height: 54px; border-radius: 14px; background: var(--vermelho); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 1.25rem; line-height: 1;
}
.ep-num small { font-size: .6rem; font-weight: 600; opacity: .85; margin-bottom: 2px; }
.ep-card h3 { margin-bottom: 4px; }
.ep-card p { margin: 6px 0 0; font-size: .9rem; color: #444b5a; }
.vazio { text-align: center; color: var(--suave); padding: 30px 10px; }

.voltar { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; font-weight: 700; text-decoration: none; }
.ep-topo { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.ep-topo .ep-num { width: 64px; height: 64px; font-size: 1.5rem; }
.ep-topo h1 { font-size: 1.35rem; margin-bottom: 6px; }
.eventos { margin: 0; padding-left: 22px; }
.eventos li { margin-bottom: 6px; }
.time-bloco { border-top: 1px solid var(--borda); padding-top: 12px; margin-top: 12px; }
.time-bloco:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.poke-detalhe { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
.poke-detalhe .info { flex: 1; min-width: 0; }
.poke-detalhe .info strong { display: block; }
.poke-detalhe .chips { margin-top: 4px; }
.nav-ep { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
.botao {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 12px; font-weight: 700;
  background: var(--escuro); color: #fff; text-decoration: none; font-size: .9rem;
}
.botao.desativado { opacity: .35; pointer-events: none; }

/* ---------- Personagens ---------- */
.pers-card { display: flex; flex-direction: column; gap: 10px; }
.pers-topo { display: flex; gap: 12px; align-items: center; }
.avatar {
  flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--escuro); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem;
}
.papel-protagonista .avatar { background: var(--vermelho); }
.papel-rival .avatar { background: var(--azul); }
.papel-companheiro .avatar { background: var(--verde); }
.papel-mentor .avatar { background: #8a5cd1; }
.papel-familia .avatar, .papel-outro .avatar { background: #6b7280; }
.pers-card h3 { margin: 0; }
.pers-card p { margin: 0; font-size: .92rem; color: #444b5a; }
.sub { font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); margin: 4px 0 6px; }
.historico { width: 100%; border-collapse: collapse; font-size: .88rem; }
.historico td { padding: 6px 4px; border-top: 1px solid var(--borda); vertical-align: middle; }
.historico td:first-child { width: 1%; white-space: nowrap; font-weight: 700; }
.destaque { border: 2px solid var(--vermelho); }

/* ---------- Tabelas ---------- */
.tabela-wrap { overflow-x: auto; background: var(--branco); border-radius: var(--raio); box-shadow: var(--sombra); border: 1px solid var(--borda); }
table.tabela { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 520px; }
.tabela th { text-align: left; background: var(--escuro); color: #fff; padding: 10px 12px; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.tabela td { padding: 10px 12px; border-top: 1px solid var(--borda); }
.tabela tr:nth-child(even) td { background: #fafbfc; }
.tabela td.n { text-align: center; font-weight: 700; }
.tabela th.n { text-align: center; }
.zero { color: #b8bdc7; font-weight: 400 !important; }

/* ---------- Arcos ---------- */
.linha-tempo { position: relative; padding-left: 28px; }
.linha-tempo::before { content: ""; position: absolute; left: 10px; top: 4px; bottom: 4px; width: 4px; background: #d7dbe3; border-radius: 2px; }
.arco { position: relative; margin-bottom: 16px; }
.arco::before {
  content: ""; position: absolute; left: -25px; top: 18px; width: 18px; height: 18px; border-radius: 50%;
  background: linear-gradient(to bottom, var(--vermelho) 0 44%, var(--escuro) 44% 56%, #fff 56%); border: 2px solid var(--escuro);
}
.arco.atual { border: 2px solid var(--vermelho); }
.faixa { font-size: 1.4rem; font-weight: 800; color: var(--vermelho-esc); }

@media (max-width: 480px) {
  .hero h1 { font-size: 1.35rem; }
  .contador .num { font-size: 1.6rem; }
  .grade-2, .grade-3 { grid-template-columns: 1fr; }
  .contadores { grid-template-columns: repeat(2, 1fr); }
}

/* Abas cabem na tela do celular */
@media (max-width: 560px) {
  .abas { padding: 0 4px; gap: 0; }
  .abas a { flex: 1 1 auto; text-align: center; padding: 10px 6px; font-size: .82rem; }
  .hero::after { opacity: .5; }
}
.texto-ep summary { cursor: pointer; font-weight: 800; font-size: 1.05rem; }
.texto-ep[open] summary { margin-bottom: 10px; }
.texto-ep p { margin: 0 0 .9em; font-size: 1rem; line-height: 1.7; }
.ep-faltando { opacity: .6; border-style: dashed; background: transparent; box-shadow: none; }
.ep-faltando:hover { transform: none; box-shadow: none; }
.ep-faltando .ep-num { background: #c3c8d2; }
.chip.faltando { background: transparent; border: 1px dashed #b8bdc7; color: #9aa1ad; }
.papel-vilao .avatar { background: #4b2a6b; }
.membros { list-style: none; margin: 0; padding: 0; }
.membros li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--borda); }
.membros li:first-child { border-top: 0; padding-top: 0; }
.membros .avatar { width: 38px; height: 38px; font-size: .9rem; }
.poke-micro { width: auto; }
.poke-micro .poke-img { width: 36px; height: 36px; border-width: 1px; }
.poke-micro .poke-img img { width: 40px; height: 40px; }
.poke-micro .poke-img.sem-img .fallback { width: 24px; height: 24px; font-size: .65rem; border-width: 2px; }
.poke-micro .poke-nome { display: none; }
.membros .time { gap: 4px; }
.objetivos { list-style: none; margin: 0; padding: 0; }
.objetivos li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--borda); }
.objetivos li:first-child { border-top: 0; }
.marca-obj { color: var(--vermelho); font-weight: 800; }
.objetivos li.feito { color: var(--suave); text-decoration: line-through; }
.objetivos li.feito .marca-obj { color: var(--verde); }
.evolucao { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.evolucao .seta { font-size: 1.4rem; color: var(--verde); font-weight: 800; }
.partes { display: grid; gap: 10px; }
.parte { border: 1px solid var(--borda); border-radius: 12px; padding: 10px 12px; background: #fafbfc; }
.parte-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }

/* ---------- Leitura do episódio completo ---------- */
.ep-wrap { position: relative; }
.ep-wrap .ep-card { padding-right: 86px; }
.ler-link {
  position: absolute; top: 14px; right: 14px; text-decoration: none; font-weight: 700; font-size: .8rem;
  background: var(--escuro); color: #fff; padding: 6px 10px; border-radius: 999px;
}
.ler-link:hover { background: var(--vermelho); }
.check { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--suave); margin: -4px 0 8px; }
.abas-ep { display: flex; gap: 6px; margin: 4px 0 14px; background: #e6e8ee; padding: 4px; border-radius: 14px; }
.abas-ep a {
  flex: 1; text-align: center; padding: 10px 8px; border-radius: 10px; text-decoration: none;
  font-weight: 700; font-size: .9rem; color: var(--escuro);
}
.abas-ep a.ativa { background: #fff; color: var(--vermelho-esc); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.abas-ep a.sem-texto { opacity: .6; }
.leitura {
  background: var(--branco); border: 1px solid var(--borda); border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 22px 20px; max-width: 70ch; margin: 0 auto;
  font-size: 1.125rem; line-height: 1.7; color: var(--texto);
  font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  overflow-wrap: break-word;
}
.leitura p { margin: 0 0 1em; }
.leitura-titulo { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 1.25rem; margin: 0 0 1em; color: var(--vermelho-esc); }
.leitura-sub {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 1.05rem; font-weight: 800;
  letter-spacing: .01em; margin: .4em 0 .9em; color: var(--escuro);
}
.leitura-divisor { border: 0; height: 1px; background: linear-gradient(to right, transparent, #c9ced8, transparent); margin: 1.6em 0; }
.nav-leitura { max-width: 70ch; margin-left: auto; margin-right: auto; flex-wrap: wrap; }
@media (max-width: 480px) {
  .leitura { padding: 18px 16px; border-radius: 12px; }
  .nav-leitura .botao { flex: 1 1 45%; justify-content: center; font-size: .82rem; padding: 10px; }
}

/* ---------- Modo escuro (segue o sistema) ---------- */
@media (prefers-color-scheme: dark) {
  :root {
    --fundo: #12141a; --branco: #1c1f27; --texto: #e7e9ee; --suave: #9aa2b1; --borda: #2e3340;
    --escuro-2: #2c3342; --sombra: 0 2px 10px rgba(0,0,0,.4);
  }
  body { background: var(--fundo); }
  a { color: #ff8a70; }
  .hero { background: linear-gradient(135deg, #232834 0%, #2c3342 100%); }
  .ep-card p, .pers-card p, .card p { color: #c9ced8; }
  .chip { background: #2a2f3b; color: #e7e9ee; }
  .chip.vermelho { background: #4a1f16; color: #ffb4a3; }
  .chip.amarelo { background: #4a3d0a; color: #ffe08a; }
  .chip.azul { background: #1d2c4d; color: #a9c3ff; }
  .chip.verde { background: #173b27; color: #9be3b8; }
  .aviso { background: #3a320f; border-color: #6b5a17; color: #ffe8a3; }
  .tabela th { background: #0e1015; }
  .tabela td { color: var(--texto); }
  .tabela-wrap { background: var(--branco); }
  .tabela tr:nth-child(even) td { background: #20242d; }
  .parte { background: #20242d; }
  .campo input, .campo select { background: #1c1f27; color: var(--texto); }
  .poke-img { background: #262a34; }
  .botao { background: #2c3342; color: #fff; }
  .secao-titulo, h1, h2, h3 { color: var(--texto); }
  .ler-link { background: #2c3342; color: #fff; }
  .abas-ep { background: #232733; }
  .abas-ep a { color: #c9ced8; }
  .abas-ep a.ativa { background: #1c1f27; color: #ff8a70; }
  .leitura { background: #1a1d24; color: #e2e4e9; }
  .leitura-sub { color: #ffffff; }
  .leitura-titulo { color: #ff8a70; }
  .leitura-divisor { background: linear-gradient(to right, transparent, #4a5060, transparent); }
  .avatar { color: #fff; }
  .ep-faltando .ep-num { background: #3a3f4b; }
}

/* ---------- Marca em duas partes ---------- */
.marca-txt { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 5px; line-height: 1.15; }
.marca-1 { font-weight: 800; }
.marca-2 { font-weight: 600; opacity: .92; }
.marca-2::before { content: "- "; }
@media (max-width: 560px) {
  .marca-txt { flex-direction: column; align-items: flex-start; }
  .marca-1 { font-size: 1.05rem; }
  .marca-2 { font-size: .78rem; }
  .marca-2::before { content: ""; }
}

/* ---------- Retratos ---------- */
.avatar.com-foto { background: #ddd; padding: 0; overflow: hidden; border: 2px solid #fff; box-shadow: 0 0 0 2px var(--vermelho); }
.avatar.com-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar-grande { width: 64px; height: 64px; font-size: 1.3rem; }
.papel-rival .avatar.com-foto { box-shadow: 0 0 0 2px var(--azul); }
.papel-companheiro .avatar.com-foto { box-shadow: 0 0 0 2px var(--verde); }
.papel-familia .avatar.com-foto, .papel-outro .avatar.com-foto { box-shadow: 0 0 0 2px #6b7280; }

/* ---------- Pôster ---------- */
.poster { margin: 0 auto 16px; max-width: 460px; text-align: center; }
.poster-botao { border: 0; padding: 0; background: none; cursor: zoom-in; display: block; width: 100%; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 22px rgba(0,0,0,.25); }
.poster-botao img { display: block; width: 100%; height: auto; }
.poster figcaption { font-size: .8rem; margin-top: 6px; color: var(--suave); }
.lightbox {

  <script>
/* app.js — lógica do site. Normalmente não é preciso editar: os dados ficam em data.js. */
(function () {
  "use strict";

  var D = window.STORY_DATA || {};
  var META = D.meta || {};
  var EPISODIOS = (D.episodes || []).slice().sort(function (a, b) { return a.numero - b.numero; });
  var PERSONAGENS = D.personagens || [];
  var TEXTOS = window.STORY_TEXTS || {};
  var IMAGENS = window.STORY_IMAGES || {};
  function srcImagem(caminho) { return IMAGENS[caminho] || caminho; }
  function avatarHTML(p, classe) {
    var ini = esc(iniciais(p.nome));
    if (p.imagem) {
      return '<div class="avatar com-foto' + (classe ? " " + classe : "") + '"><img src="' + esc(srcImagem(p.imagem)) + '" alt="Retrato de ' + esc(p.nome) +
        '" loading="lazy" onerror="this.parentNode.classList.remove(\'com-foto\');this.parentNode.textContent=\'' + ini + '\'"></div>';
    }
    return '<div class="avatar' + (classe ? " " + classe : "") + '">' + ini + "</div>";
  }
  function textoCompleto(ep) {
    var t = TEXTOS[ep.numero] || TEXTOS[String(ep.numero)] || ep.texto || "";
    return String(t).replace(/\r\n?/g, "\n").trim();
  }
  var buscaNoTexto = true;
  var ARCOS = (D.arcos || []).slice();
  // Episódios sem arco (ou com um arco ainda não cadastrado) viram "Arco a definir".
  var ARCO_INDEFINIDO = "Arco a definir";
  (function () {
    function normA(x) { return String(x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, ""); }
    EPISODIOS.forEach(function (ep) {
      var nome = String(ep.arco || "").trim();
      var existe = nome && ARCOS.some(function (a) { return normA(a.nome) === normA(nome); });
      if (existe) return;
      ep.arco = nome || ARCO_INDEFINIDO;
      var virtual = ARCOS.filter(function (a) { return a.virtual && normA(a.nome) === normA(ep.arco); })[0];
      if (!virtual) {
        virtual = { nome: ep.arco, regiao: "", episodios: { inicio: ep.numero, fim: null }, provisorio: true, virtual: true,
          descricao: "Arco ainda não definido pelo autor. Os episódios aparecem aqui até o arco ganhar nome." };
        ARCOS.push(virtual);
      }
      if (ep.numero < virtual.episodios.inicio) virtual.episodios.inicio = ep.numero;
    });
  })();
  var app = document.getElementById("app");

  var PAPEIS = [
    { chave: "protagonista", titulo: "Protagonista", rotulo: "Protagonista" },
    { chave: "rival", titulo: "Rivais", rotulo: "Rival" },
    { chave: "companheiro", titulo: "Companheiros de viagem", rotulo: "Companheiro(a) de viagem" },
    { chave: "mentor", titulo: "Mentores", rotulo: "Mentor" },
    { chave: "vilao", titulo: "Vilões", rotulo: "Vilão" },
    { chave: "familia", titulo: "Família e outros", rotulo: "Família" },
    { chave: "outro", titulo: "Família e outros", rotulo: "Outro" }
  ];
  // Categorias de conquista vêm de data.js (categoriasConquista). Só aparecem as que têm entradas.
  var TODOS_TIPOS = (D.categoriasConquista && D.categoriasConquista.length ? D.categoriasConquista : [
    { chave: "insignia", nome: "Insígnias", sing: "Insígnia", cor: "amarelo" },
    { chave: "fita", nome: "Fitas", sing: "Fita", cor: "vermelho" }
  ]).map(function (t) { return { chave: t.chave, nome: t.nome || t.chave, sing: t.sing || t.nome || t.chave, cor: t.cor || "", descricao: t.descricao || "" }; });
  var TIPOS = TODOS_TIPOS.filter(function (t) {
    var tem = function (c) { return c && norm(c.tipo) === norm(t.chave); };
    return (D.conquistasAnteriores || []).some(tem) ||
      (D.episodes || []).some(function (ep) { return (ep.conquistas || []).some(tem); }) ||
      (D.personagens || []).some(function (p) { return (p.contagemDeclarada || []).some(tem); });
  });
  function corContador(t) { return t.cor === "vermelho" ? "" : t.cor; }

  /* ---------------- utilitários ---------------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function norm(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
  }
  function iniciais(nome) {
    var p = String(nome || "?").trim().split(/\s+/);
    return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
  }
  function rotuloPapel(p) {
    if (p.papel === "rival" && p.rivalDe) return "Rival de " + String(p.rivalDe).split(/\s+/)[0];
    return papelInfo(p.papel).rotulo;
  }
  function papelInfo(chave) {
    for (var i = 0; i < PAPEIS.length; i++) if (PAPEIS[i].chave === chave) return PAPEIS[i];
    return PAPEIS[PAPEIS.length - 1];
  }
  function tipoInfo(chave) {
    for (var i = 0; i < TODOS_TIPOS.length; i++) if (norm(TODOS_TIPOS[i].chave) === norm(chave)) return TODOS_TIPOS[i];
    return { chave: norm(chave), nome: String(chave || "Outro"), sing: String(chave || "Outro"), cor: "" };
  }

  /* ---------------- Pokédex / sprites ---------------- */
  var DEX = {};
  (window.POKEDEX_NOMES || []).forEach(function (n, i) { DEX[norm(n)] = i + 1; });
  (window.POKEDEX_API || []).forEach(function (n, i) { DEX[norm(n)] = i + 1; });
  DEX["nidoranfemea"] = 29; DEX["nidoranmacho"] = 32;
  var SPRITE_URL = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";

  window.__abrirPoster = function () {
    var capa = META.capa; if (!capa) return;
    var o = document.createElement("div");
    o.className = "lightbox";
    o.setAttribute("role", "dialog");
    o.innerHTML = '<img src="' + esc(srcImagem(capa.imagem)) + '" alt="' + esc(capa.alt || "") + '"><span class="lightbox-fechar">✕ Fechar</span>';
    o.addEventListener("click", function () { o.remove(); });
    document.body.appendChild(o);
  };
  window.__semSprite = function (img) {
    var box = img.parentNode;
    if (box) box.classList.add("sem-img");
    img.remove();
  };
  function sprite(nome, mini, extraClasse, titulo) {
    var id = DEX[norm(nome)];
    var img = id ? '<img loading="lazy" alt="" src="' + SPRITE_URL + id + '.png" onerror="__semSprite(this)">' : "";
    return '<div class="poke' + (mini ? " poke-mini" : "") + (extraClasse ? " " + extraClasse : "") + '"' +
      (titulo ? ' title="' + esc(titulo) + '"' : "") + '>' +
      '<div class="poke-img' + (id ? "" : " sem-img") + '">' + img +
      '<span class="fallback">' + esc(String(nome).charAt(0).toUpperCase()) + '</span></div>' +
      '<div class="poke-nome">' + esc(nome) + '</div></div>';
  }

  /* ---------------- acesso aos dados ---------------- */
  function mesmo(ref, pers) {
    var n = norm(ref);
    if (!pers) return false;
    if (n === norm(pers.nome) || (pers.id && n === norm(pers.id))) return true;
    return (pers.apelidos || []).some(function (a) { return norm(a) === n; });
  }
  function acharPersonagem(ref) {
    for (var i = 0; i < PERSONAGENS.length; i++) if (mesmo(ref, PERSONAGENS[i])) return PERSONAGENS[i];
    return null;
  }
  function textoDeclarado(d) {
    var ti = tipoInfo(d.tipo);
    var nome = d.quantidade === 1 ? ti.sing.toLowerCase() : ti.nome.toLowerCase();
    return d.quantidade + " " + nome + " (segundo " + d.fonte + ", Ep. " + d.episodio + ")";
  }
  function declaradoMaisRecente(pers, tipo) {
    var r = null;
    (pers.contagemDeclarada || []).forEach(function (d) {
      if (tipoInfo(d.tipo).chave === tipo && (!r || d.episodio >= r.episodio)) r = d;
    });
    return r;
  }
  function entradaPoke(p) { return typeof p === "string" ? { nome: p } : (p || {}); }
  function timeNoEpisodio(ep, pers) {
    var t = ep.times || {};
    for (var k in t) if (Object.prototype.hasOwnProperty.call(t, k) && mesmo(k, pers)) return (t[k] || []).map(entradaPoke);
    return null;
  }
  function aparece(ep, pers) {

  function paginaPersonagens() {

  function chipsArco(a, eps) {
    var nums = eps.map(function (e) { return e.numero; });
    var ini = a.episodios && a.episodios.inicio != null ? a.episodios.inicio : Math.min.apply(null, nums);
    var fim = a.episodios && a.episodios.fim != null ? a.episodios.fim : Math.max.apply(null, nums);
    var h = "";
    for (var n = ini; n <= fim; n++) {
      var e = eps.filter(function (x) { return x.numero === n; })[0];
      h += e ? '<a class="chip vermelho" href="#episodios/' + n + '" title="' + esc(e.titulo) + '">Ep. ' + n + "</a>" :
        '<span class="chip faltando" title="Episódio ainda não enviado">Ep. ' + n + "</span>";
    }
    return h;
  }

        ((a.partes || []).length ? '<div class="sub">Partes do arco</div><div class="partes">' + a.partes.map(function (pt) {
          var ini = pt.episodios && pt.episodios.inicio, fim = pt.episodios && pt.episodios.fim;
          var epsP = eps.filter(function (e) { return (ini == null || e.numero >= ini) && (fim == null || e.numero <= fim); });

    }).join("") + "</div>";
    return h;
  }

  /* ---------------- roteamento ---------------- */
  function rota() {
    var hash = decodeURIComponent((location.hash || "#inicio").slice(1));
    var partes = hash.split("/");
    var aba = partes[0] || "inicio";
    var html;
    switch (aba) {
      case "episodios": html = partes[1] ? paginaEpisodio(partes[1]) : paginaEpisodios(); break;
      case "ler": aba = "episodios"; html = paginaLeitura(partes[1]); partes[1] = partes[1] || "x"; break;
      case "personagens": html = paginaPersonagens(); break;
      case "conquistas": html = paginaConquistas(); break;
      case "arcos": html = paginaArcos(); break;
      default: aba = "inicio"; html = paginaInicio();
    }
    app.innerHTML = html;
    if (aba === "episodios" && !partes[1]) ligarFiltros();
    var links = document.querySelectorAll("#abas a");
    for (var i = 0; i < links.length; i++) links[i].classList.toggle("ativa", links[i].getAttribute("data-aba") === aba);
    window.scrollTo(0, 0);
  }

    var partesTitulo = String(META.titulo).split(/\s+[-–—]\s+/);
    tituloEl.innerHTML = '<span class="marca-1">' + esc(partesTitulo[0]) + "</span>" +
      (partesTitulo.length > 1 ? '<span class="marca-2">' + esc(partesTitulo.slice(1).join(" - ")) + "</span>" : "");
  }
  var rod = document.getElementById("rodape");
  if (rod) rod.innerHTML = esc(EPISODIOS.length + (EPISODIOS.length === 1 ? " episódio registrado" : " episódios registrados") + " de ~160") +
    (META.atualizadoEm ? " · Atualizado em " + esc(META.atualizadoEm) : "") + "<br>Fã-ficção original de Robson. Pokémon é marca da Nintendo, Game Freak e The Pokémon Company." +
    '<br><span class="creditos">' + esc(META.creditosImagens || "Arte oficial dos personagens do anime © Nintendo/Creatures/GAME FREAK/The Pokémon Company, via Bulbagarden Archives.") + "</span>";
  window.addEventListener("hashchange", rota);
  rota();
})();

</script>

</html>
